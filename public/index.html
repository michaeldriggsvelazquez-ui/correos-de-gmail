<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GmailAccounts</title>

    <meta
        name="description"
        content="GmailAccounts - Acceso a tu cuenta"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #050505;
            --surface: #0d0d0d;
            --surface-hover: #151515;
            --border: rgba(255, 255, 255, 0.10);
            --border-focus: rgba(255, 255, 255, 0.22);
            --text: #f5f5f5;
            --secondary: #999;
            --muted: #666;
            --button: #f2f2f2;
            --button-text: #080808;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--background);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================================
           MAIN
        ========================================= */

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,0.045),
                    transparent 34%
                ),
                #050505;
        }


        .container {
            width: 100%;
            max-width: 390px;
            animation: pageIn 0.55s ease;
        }


        /* =========================================
           BRAND
        ========================================= */

        .brand {
            text-align: center;
            margin-bottom: 34px;
        }


        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 17px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.35);
        }


        /*
         * Logo de Google simplificado.
         * No depende de una imagen externa.
         */

        .google-logo {
            position: relative;

            width: 28px;
            height: 28px;

            border-radius: 50%;

            background:
                conic-gradient(
                    from -45deg,
                    #4285f4 0deg 90deg,
                    #34a853 90deg 180deg,
                    #fbbc05 180deg 270deg,
                    #ea4335 270deg 360deg
                );
        }


        .google-logo::before {
            content: "";

            position: absolute;

            inset: 6px;

            background: #fff;

            border-radius: 50%;
        }


        .google-logo::after {
            content: "";

            position: absolute;

            width: 13px;
            height: 6px;

            right: 1px;
            top: 11px;

            background: #4285f4;

            border-radius: 0 4px 4px 0;
        }


        .brand-title {
            font-size: 29px;
            line-height: 1;

            font-weight: 700;

            letter-spacing: -1.1px;
        }


        .brand-title span {
            color: #888;
        }


        .brand-subtitle {
            margin-top: 9px;

            color: var(--secondary);

            font-size: 13px;
            line-height: 1.5;
        }


        /* =========================================
           AUTH CARD
        ========================================= */

        .auth-card {
            width: 100%;

            padding: 23px;

            border: 1px solid var(--border);

            border-radius: 23px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.015)
                );

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.35);
        }


        /* =========================================
           TABS
        ========================================= */

        .tabs {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 4px;

            padding: 4px;

            margin-bottom: 25px;

            background: #0a0a0a;

            border: 1px solid rgba(255,255,255,0.055);

            border-radius: 13px;
        }


        .tab {
            height: 40px;

            border: 0;

            border-radius: 9px;

            background: transparent;

            color: #707070;

            font-size: 12px;
            font-weight: 600;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }


        .tab.active {
            background: #1b1b1b;

            color: #f5f5f5;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.25);
        }


        /* =========================================
           FORMS
        ========================================= */

        .form {
            display: none;
        }


        .form.active {
            display: block;

            animation: formIn 0.25s ease;
        }


        .form-title {
            margin-bottom: 5px;

            font-size: 19px;
            font-weight: 700;

            letter-spacing: -0.4px;
        }


        .form-description {
            margin-bottom: 22px;

            color: var(--secondary);

            font-size: 12px;

            line-height: 1.55;
        }


        /* =========================================
           INPUTS
        ========================================= */

        .field {
            margin-bottom: 14px;
        }


        .field label {
            display: block;

            margin-bottom: 7px;

            color: #bcbcbc;

            font-size: 11px;
            font-weight: 600;
        }


        .input {
            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid var(--border);

            border-radius: 12px;

            outline: none;

            background:
                rgba(255,255,255,0.035);

            color: #fff;

            font-size: 13px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .input::placeholder {
            color: #555;
        }


        .input:focus {
            border-color: var(--border-focus);

            background:
                rgba(255,255,255,0.055);

            box-shadow:
                0 0 0 3px rgba(255,255,255,0.025);
        }


        /* =========================================
           SUBMIT
        ========================================= */

        .submit-button {
            width: 100%;

            height: 48px;

            margin-top: 7px;

            border: 0;

            border-radius: 13px;

            background: var(--button);

            color: var(--button-text);

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 0.4px;

            transition:
                transform 0.15s ease,
                opacity 0.2s ease;
        }


        .submit-button:hover {
            opacity: 0.92;
        }


        .submit-button:active {
            transform: scale(0.985);
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            display: none;

            margin-top: 13px;

            padding: 11px 13px;

            border-radius: 11px;

            background: rgba(255,255,255,0.045);

            border: 1px solid var(--border);

            color: #999;

            font-size: 11px;

            line-height: 1.5;
        }


        .message.show {
            display: block;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            margin-top: 20px;

            text-align: center;

            color: #4f4f4f;

            font-size: 10px;

            line-height: 1.5;
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes formIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================
           SMALL SCREENS
        ========================================= */

        @media (max-width: 420px) {

            .page {
                padding: 20px 15px;
            }

            .brand {
                margin-bottom: 27px;
            }

            .logo {
                width: 54px;
                height: 54px;
                border-radius: 17px;
            }

            .brand-title {
                font-size: 27px;
            }

            .auth-card {
                padding: 19px;
                border-radius: 20px;
            }

        }

    </style>
</head>


<body>

    <main class="page">

        <div class="container">


            <!-- =====================================
                 BRAND
            ====================================== -->

            <section class="brand">

                <div class="logo">

                    <div class="google-logo"></div>

                </div>


                <h1 class="brand-title">
                    Gmail<span>Accounts</span>
                </h1>


                <p class="brand-subtitle">
                    Gestiona tu cuenta desde un solo lugar.
                </p>

            </section>


            <!-- =====================================
                 AUTH
            ====================================== -->

            <section class="auth-card">


                <!-- TABS -->

                <div class="tabs">

                    <button
                        type="button"
                        class="tab active"
                        id="loginTab"
                    >
                        Iniciar sesión
                    </button>


                    <button
                        type="button"
                        class="tab"
                        id="registerTab"
                    >
                        Registrarse
                    </button>

                </div>


                <!-- =================================
                     LOGIN
                ================================== -->

                <form
                    class="form active"
                    id="loginForm"
                >

                    <h2 class="form-title">
                        Bienvenido de nuevo
                    </h2>


                    <p class="form-description">
                        Inicia sesión para continuar
                        utilizando GmailAccounts.
                    </p>


                    <div class="field">

                        <label for="loginIdentifier">
                            Correo o usuario
                        </label>

                        <input
                            class="input"
                            id="loginIdentifier"
                            type="text"
                            placeholder="correo o usuario"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="loginPassword">
                            Contraseña
                        </label>

                        <input
                            class="input"
                            id="loginPassword"
                            type="password"
                            placeholder="Contraseña"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        CONTINUAR
                    </button>


                    <div
                        class="message"
                        id="loginMessage"
                    ></div>

                </form>


                <!-- =================================
                     REGISTER
                ================================== -->

                <form
                    class="form"
                    id="registerForm"
                >

                    <h2 class="form-title">
                        Crear cuenta
                    </h2>


                    <p class="form-description">
                        Crea tu cuenta para comenzar.
                    </p>


                    <div class="field">

                        <label for="registerUsername">
                            Usuario
                        </label>

                        <input
                            class="input"
                            id="registerUsername"
                            type="text"
                            placeholder="Elige un usuario"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="registerEmail">
                            Correo electrónico
                        </label>

                        <input
                            class="input"
                            id="registerEmail"
                            type="email"
                            placeholder="tucorreo@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="registerPassword">
                            Contraseña
                        </label>

                        <input
                            class="input"
                            id="registerPassword"
                            type="password"
                            placeholder="Crea una contraseña"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        CREAR CUENTA
                    </button>


                    <div
                        class="message"
                        id="registerMessage"
                    ></div>

                </form>

            </section>


            <!-- =====================================
                 FOOTER
            ====================================== -->

            <footer class="footer">

                GmailAccounts · Sistema privado

            </footer>

        </div>

    </main>


    <script>

        /* =========================================
           ELEMENTOS
        ========================================= */

        const loginTab =
            document.getElementById("loginTab");

        const registerTab =
            document.getElementById("registerTab");

        const loginForm =
            document.getElementById("loginForm");

        const registerForm =
            document.getElementById("registerForm");

        const loginMessage =
            document.getElementById("loginMessage");

        const registerMessage =
            document.getElementById("registerMessage");


        /* =========================================
           CAMBIAR A LOGIN
        ========================================= */

        function showLogin() {

            loginTab.classList.add("active");
            registerTab.classList.remove("active");

            loginForm.classList.add("active");
            registerForm.classList.remove("active");

            loginMessage.classList.remove("show");
            registerMessage.classList.remove("show");

        }


        /* =========================================
           CAMBIAR A REGISTRO
        ========================================= */

        function showRegister() {

            registerTab.classList.add("active");
            loginTab.classList.remove("active");

            registerForm.classList.add("active");
            loginForm.classList.remove("active");

            loginMessage.classList.remove("show");
            registerMessage.classList.remove("show");

        }


        loginTab.addEventListener(
            "click",
            showLogin
        );


        registerTab.addEventListener(
            "click",
            showRegister
        );


        /* =========================================
           LOGIN TEMPORAL
        ========================================= */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                /*
                 * TEMPORAL
                 *
                 * Aquí conectaremos posteriormente
                 * la autenticación real con nuestro
                 * Worker + D1.
                 */

                loginMessage.textContent =
                    "La autenticación se conectará al sistema de cuentas.";

                loginMessage.classList.add("show");

            }
        );


        /* =========================================
           REGISTRO TEMPORAL
        ========================================= */

        registerForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                /*
                 * TEMPORAL
                 *
                 * Aquí conectaremos posteriormente
                 * el registro con Cloudflare D1.
                 */

                registerMessage.textContent =
                    "El registro se conectará al sistema de cuentas.";

                registerMessage.classList.add("show");

            }
        );

    </script>

</body>
                  </html>
