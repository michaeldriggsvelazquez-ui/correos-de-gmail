<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Gmail Accounts</title>

  <meta
    name="description"
    content="Gmail Accounts - Sistema privado"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #ffffff;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255, 255, 255, 0.055),
          transparent 32%
        ),
        #050505;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 22px;
      position: relative;
    }

    .welcome-content {
      width: 100%;
      max-width: 560px;
      text-align: center;
      animation: welcomeIn 0.8s ease forwards;
    }

    .brand {
      font-size: clamp(38px, 11vw, 72px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 0.95;
      margin-bottom: 22px;
    }

    .brand span {
      color: #8b8b8b;
    }

    .description {
      max-width: 430px;
      margin: 0 auto;
      color: #a1a1a1;
      font-size: 16px;
      line-height: 1.7;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      color: #777;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    .scroll-arrow {
      display: block;
      margin-top: 10px;
      font-size: 20px;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-section {
      min-height: 100vh;
      padding: 80px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
    }

    .auth-header {
      margin-bottom: 28px;
    }

    .auth-header h2 {
      font-size: 32px;
      letter-spacing: -1.2px;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: #858585;
      line-height: 1.6;
      font-size: 14px;
    }

    .auth-card {
      border: 1px solid #1d1d1d;
      background: #0a0a0a;
      border-radius: 22px;
      padding: 24px;
      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      background: #111111;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #777;
      padding: 11px;
      transition: 0.2s ease;
    }

    .tab.active {
      background: #202020;
      color: #fff;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
      animation: formIn 0.25s ease;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #b7b7b7;
      font-size: 13px;
    }

    .field input {
      width: 100%;
      border: 1px solid #242424;
      background: #111111;
      color: #fff;
      border-radius: 12px;
      padding: 14px 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .field input:focus {
      border-color: #555;
    }

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #ffffff;
      color: #050505;
      padding: 14px;
      font-weight: 700;
      margin-top: 4px;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .submit-button:hover {
      transform: translateY(-1px);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #151515;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .auth-note {
      text-align: center;
      margin-top: 18px;
      color: #5e5e5e;
      font-size: 12px;
      line-height: 1.5;
    }

    @keyframes welcomeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes formIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .welcome {
        padding: 24px 18px;
      }

      .brand {
        letter-spacing: -2px;
      }

      .auth-section {
        padding: 60px 18px;
      }

      .auth-card {
        padding: 18px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- =========================
         PANTALLA DE BIENVENIDA
    ========================== -->

    <section class="welcome" id="welcome">

      <div class="welcome-content">

        <h1 class="brand">
          Gmail<span>Accounts</span>
        </h1>

        <p class="description">
          Sistema privado para gestionar tu cuenta,
          solicitudes, historial y actividad desde una
          interfaz sencilla.
        </p>

      </div>

      <div class="scroll-indicator">
        Desliza para continuar
        <span class="scroll-arrow">↓</span>
      </div>

    </section>


    <!-- =========================
         AUTENTICACIÓN
    ========================== -->

    <section class="auth-section" id="auth">

      <div class="auth-container">

        <div class="auth-header">

          <h2>Tu cuenta</h2>

          <p>
            Inicia sesión o crea una cuenta para
            continuar.
          </p>

        </div>


        <div class="auth-card">

          <div class="tabs">

            <button
              type="button"
              class="tab active"
              id="loginTab"
            >
              Iniciar sesión
            </button>

            <button
              type="button"
              class="tab"
              id="registerTab"
            >
              Registrarse
            </button>

          </div>


          <!-- LOGIN -->

          <form
            class="form active"
            id="loginForm"
          >

            <div class="field">

              <label for="loginIdentifier">
                Correo o usuario
              </label>

              <input
                id="loginIdentifier"
                type="text"
                autocomplete="username"
                placeholder="Tu correo o usuario"
                required
              />

            </div>


            <div class="field">

              <label for="loginPassword">
                Contraseña
              </label>

              <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                placeholder="Tu contraseña"
                required
              />

            </div>


            <button
              type="submit"
              class="submit-button"
            >
              INICIAR SESIÓN
            </button>

            <div
              class="message"
              id="loginMessage"
            ></div>

          </form>


          <!-- REGISTRO -->

          <form
            class="form"
            id="registerForm"
          >

            <div class="field">

              <label for="registerUsername">
                Usuario
              </label>

              <input
                id="registerUsername"
                type="text"
                autocomplete="username"
                placeholder="Crea un usuario"
                required
              />

            </div>


            <div class="field">

              <label for="registerEmail">
                Correo electrónico
              </label>

              <input
                id="registerEmail"
                type="email"
                autocomplete="email"
                placeholder="tucorreo@email.com"
                required
              />

            </div>


            <div class="field">

              <label for="registerPassword">
                Contraseña
              </label>

              <input
                id="registerPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Crea una contraseña"
                required
              />

            </div>


            <button
              type="submit"
              class="submit-button"
            >
              CREAR CUENTA
            </button>

            <div
              class="message"
              id="registerMessage"
            ></div>

          </form>

        </div>


        <p class="auth-note">
          La autenticación real se conectará posteriormente
          con el sistema de usuarios.
        </p>

      </div>

    </section>

  </main>


  <script>
    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const loginMessage =
      document.getElementById("loginMessage");

    const registerMessage =
      document.getElementById("registerMessage");


    function showLogin() {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      loginForm.classList.add("active");
      registerForm.classList.remove("active");

      loginMessage.classList.remove("show");
      registerMessage.classList.remove("show");
    }


    function showRegister() {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      registerForm.classList.add("active");
      loginForm.classList.remove("active");

      loginMessage.classList.remove("show");
      registerMessage.classList.remove("show");
    }


    loginTab.addEventListener(
      "click",
      showLogin
    );


    registerTab.addEventListener(
      "click",
      showRegister
    );


    loginForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        /*
          TEMPORAL

          La autenticación real se conectará
          posteriormente con Cloudflare D1.

          Por ahora solamente mostramos
          el estado de la interfaz.
        */

        loginMessage.textContent =
          "La conexión con el sistema de cuentas todavía no está configurada.";

        loginMessage.classList.add("show");

      }
    );


    registerForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        /*
          TEMPORAL

          El registro real se conectará
          posteriormente con Cloudflare D1.
        */

        registerMessage.textContent =
          "El registro estará disponible cuando conectemos la base de datos.";

        registerMessage.classList.add("show");

      }
    );


    /*
      Si posteriormente existe una sesión válida,
      aquí podremos redirigir automáticamente
      hacia app.html.
    */
  </script>

</body>
  </html>
